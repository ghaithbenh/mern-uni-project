name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # Les tests utilisent un MongoDB en mémoire (mongodb-memory-server) ;
      # pas besoin d'un service MongoDB dans le job.
      - run: npm test

  client:
    name: Client — typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Le bundle client est géré par Vercel (vercel.json) :
      # on l'archive comme artefact pour déploiement manuel rapide.
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
