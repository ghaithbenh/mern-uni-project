name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint — ESLint (tout le monorepo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .

      - run: npm run lint
        working-directory: .

  server:
    name: Server — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # Les tests utilisent un MongoDB en mémoire (mongodb-memory-server) ;
      # pas besoin d'un service MongoDB dans le job.
      - run: npm test

  client:
    name: Client — typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Le bundle client est géré par Vercel (vercel.json) :
      # on l'archive comme artefact pour déploiement manuel rapide.
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist

  e2e:
    name: E2E — Playwright (parcours navigateur)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Le front e2e importe les sources server et client : leurs deps
      # sont nécessaires pour lancer les deux webServers du setup.
      - run: npm ci
        working-directory: server

      - run: npm ci
        working-directory: client

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
